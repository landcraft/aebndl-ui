<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEBN Downloader</title>
    <link rel="stylesheet" href="/static/styles.css?v=3">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>AEBN Downloader</h1>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
                <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </header>

        <main class="layout-stack">
            <!-- New Download Form -->
            <section class="card">
                <div class="card-header">Queue Download</div>
                <form id="download-form">
                    <div class="form-row">
                        <div class="input-group" style="flex: 4;">
                            <label for="url">Video URL</label>
                            <input type="url" id="url" name="url" placeholder="https://aebn.net/..." required>
                        </div>

                        <div class="input-group" style="flex: 1;">
                            <label for="threads">Threads</label>
                            <input type="number" id="threads" name="threads" value="10" min="1" max="20">
                        </div>

                        <div class="input-group" style="flex: 1.5;">
                            <label for="resolution">Resolution</label>
                            <select id="resolution" name="resolution">
                                <option value="2160">4K</option>
                                <option value="1440">1440p</option>
                                <option value="1080">1080p</option>
                                <option value="720" selected>720p</option>
                                <option value="480">480p</option>
                            </select>
                        </div>

                        <div class="input-group" style="flex: 1;">
                            <label for="scene">Scene</label>
                            <input type="number" id="scene" name="scene" placeholder="1">
                        </div>

                        <div class="input-group" style="flex: 0 0 auto;">
                            <button type="submit" id="start-btn" class="btn">Queue</button>
                        </div>
                    </div>
                </form>
            </section>

            <!-- Active Jobs -->
            <section class="card">
                <div class="card-header">Downloads</div>
                <div id="job-list-container" class="job-list">
                    <div class="empty-state">No active or recent downloads</div>
                </div>
            </section>
        </main>

        <footer class="system-info">
            <span>Version: <span id="sys-version">...</span></span>
            <span>Updated: <span id="sys-date">...</span></span>
            <a href="https://github.com/landcraft/aebndl-ui" target="_blank" rel="noopener">GitHub</a>
        </footer>
    </div>

    <script>
        // Theme Logic
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const root = document.documentElement;

        const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        const sunIcon = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';

        function setIcon(isLight) {
            themeIcon.innerHTML = isLight ? sunIcon : moonIcon;
        }

        const savedTheme = localStorage.getItem('theme');
        const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)');

        function applyTheme(isLight) {
            if (isLight) {
                root.classList.add('light-mode');
                setIcon(true);
            } else {
                root.classList.remove('light-mode');
                setIcon(false);
            }
        }

        if (savedTheme) {
            applyTheme(savedTheme === 'light');
        } else {
            applyTheme(systemPrefersLight.matches);
        }

        systemPrefersLight.addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                applyTheme(e.matches);
            }
        });

        themeToggle.addEventListener('click', () => {
            const isLightCurrently = root.classList.contains('light-mode');
            const newIsLight = !isLightCurrently;
            applyTheme(newIsLight);
            localStorage.setItem('theme', newIsLight ? 'light' : 'dark');
        });

        // Form Submission
        document.getElementById('download-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.textContent = 'Queueing...';

            const formData = new FormData(e.target);
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    body: formData
                });
                await response.json();
                document.getElementById('url').value = '';
                document.getElementById('scene').value = '';
            } catch (error) {
                alert('Error: ' + error);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Queue';
            }
        });

        // Job Updates via SSE
        const eventSource = new EventSource('/stream-status');
        eventSource.onmessage = function (event) {
            try {
                const jobs = JSON.parse(event.data);
                renderJobs(jobs);
            } catch (e) {
                console.error("Error parsing SSE data", e);
            }
        };

        function renderJobs(jobs) {
            const container = document.getElementById('job-list-container');

            if (jobs.length === 0) {
                container.innerHTML = '<div class="empty-state">No active or recent downloads</div>';
                return;
            }

            container.innerHTML = '';

            const running = jobs.filter(j => ['running', 'downloading', 'muxing', 'scraping', 'cleaning'].includes(j.status));
            const queued = jobs.filter(j => j.status === 'queued');
            const history = jobs.filter(j => !['running', 'downloading', 'muxing', 'scraping', 'cleaning', 'queued'].includes(j.status));

            const displayJobs = [...running, ...queued, ...history.reverse()];

            displayJobs.forEach(job => {
                const item = document.createElement('div');
                item.className = 'job-item';

                // Status Badge
                let badgeClass = 'badge-queued';
                if (['running', 'downloading'].includes(job.status)) badgeClass = 'badge-running';
                else if (job.status === 'muxing') badgeClass = 'badge-muxing';
                else if (job.status === 'scraping') badgeClass = 'badge-scraping';
                else if (job.status === 'cleaning') badgeClass = 'badge-cleaning';
                else if (job.status === 'completed') badgeClass = 'badge-success';
                else if (job.status === 'failed' || job.status === 'error') badgeClass = 'badge-error';

                // Progress UI
                const progress = job.progress || 0;
                let progressMsg = `${progress}%`;
                let etaMsg = job.eta ? `ETA: ${job.eta}` : '';
                let progressClass = '';

                if (job.status === 'error' || job.status === 'failed') {
                    progressMsg = job.message;
                    etaMsg = '';
                    progressClass = 'error-text';
                } else if (job.status === 'queued') {
                    progressMsg = 'Waiting in queue...';
                } else if (job.status === 'scraping') {
                    progressMsg = 'Fetching Metadata...';
                } else if (job.status === 'cleaning') {
                    progressMsg = 'Cleaning up files...';
                } else if (job.status === 'completed') {
                    progressMsg = 'Download complete';
                }

                const res = job.resolution || '-';
                const displayRes = res.toString().includes('p') ? res : res + 'p';
                const displayName = job.title ? job.title : job.url;
                const scene = job.scene ? `Scene ${job.scene}` : 'Full Video';

                // Actions
                let actions = '';
                if (['running', 'downloading', 'muxing', 'scraping', 'cleaning', 'queued'].includes(job.status)) {
                    actions = `<button onclick="stopJob('${job.id}')" class="btn btn-sm btn-stop" aria-label="Stop Job">Stop</button>`;
                } else {
                    actions = `
                        <button onclick="restartJob('${job.id}')" class="btn btn-sm btn-restart" aria-label="Restart Job">Restart</button>
                        <button onclick="deleteJob('${job.id}')" class="btn btn-sm btn-delete" aria-label="Remove Job">Remove</button>
                    `;
                }

                item.innerHTML = `
                    <div><span class="badge ${badgeClass}">${job.status}</span></div>
                    <div class="job-meta">
                        <div class="job-name" title="${job.url}">${displayName}</div>
                        <div class="job-details">
                            <span>${displayRes}</span> &bull; <span>${scene}</span>
                        </div>
                    </div>
                    <div class="job-progress-col">
                        <div class="progress-info ${progressClass}">
                            <span>${progressMsg}</span>
                            <span>${etaMsg}</span>
                        </div>
                        <div class="progress-container" role="progressbar" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100">
                            <div class="progress-bar" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    <div class="job-actions">${actions}</div>
                `;
                container.appendChild(item);
            });
        }

        async function stopJob(id) {
            if (!confirm('Stop download?')) return;
            await fetch(`/cancel/${id}`, { method: 'POST' });
        }

        async function restartJob(id) {
            await fetch(`/restart/${id}`, { method: 'POST' });
        }

        async function deleteJob(id) {
            await fetch(`/delete/${id}`, { method: 'DELETE' });
        }

        window.addEventListener('load', async () => {
            try {
                const res = await fetch('/system-info');
                const data = await res.json();
                document.getElementById('sys-version').textContent = data.version;
                document.getElementById('sys-date').textContent = data.date;
            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>

</html>
